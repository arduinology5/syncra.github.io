<style>
@property --c{syntax:"<color>";inherits:false;initial-value:#fa2d48}
:root{--bg:#f2f2f7;--bo:.6;--gl:rgba(255,255,255,.45);--gb:rgba(255,255,255,.75);--hi:rgba(255,255,255,.9);--lo:rgba(0,0,0,.05);--sh:0 10px 40px rgba(0,0,0,.12);--sp:.55;--tx:#1d1d1f;--t2:#5f5f66;--ac:#fa2d48;--fl:rgba(120,120,128,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#000;--bo:.8;--gl:rgba(255,255,255,.1);--gb:rgba(255,255,255,.2);--hi:rgba(255,255,255,.3);--lo:rgba(0,0,0,.3);--sh:0 14px 44px rgba(0,0,0,.45);--sp:.22;--tx:#fff;--t2:#b4b4bb;--fl:rgba(255,255,255,.14);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body:not(.cc) .ho,body:not(.rh) .hh,body:not(.rl) .lo{display:none!important}
body:not([data-t="0"]) #fl{display:none}
/* dynamic background */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
#bg i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;background:radial-gradient(circle,var(--c) 0,transparent 62%);opacity:var(--bo);transition:--c 2.4s;animation:dr 26s ease-in-out infinite alternate;animation-play-state:paused;will-change:transform}
body.pl #bg i{animation-play-state:running}
#bg i:nth-child(1){left:-35vmax;top:-35vmax}
#bg i:nth-child(2){right:-45vmax;top:5vh;animation-duration:31s;animation-delay:-8s}
#bg i:nth-child(3){left:-30vmax;bottom:-45vmax;animation-duration:37s;animation-delay:-14s}
#bg i:nth-child(4){right:-45vmax;bottom:-35vmax;animation-duration:29s;animation-delay:-3s}
@keyframes dr{to{transform:translate3d(14vmax,-10vmax,0) scale(1.2)}}
@media(prefers-reduced-motion:reduce){#bg i{animation:none}}
/* liquid glass */
.gl,.card{background:var(--gl);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo)}
.card{position:relative;border-radius:30px;padding:18px;margin:0 0 14px;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.4),transparent 40%);opacity:var(--sp);pointer-events:none}
.card>*{position:relative}
main{max-width:480px;margin:0 auto;padding:12px 16px 130px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
h1{font-size:32px;letter-spacing:-.03em;margin:0}h2{font-size:19px;margin:0 0 12px;letter-spacing:-.01em}h3{font-size:24px;margin:16px 0 4px;letter-spacing:-.02em;line-height:1.2}
.nt{color:var(--t2);font-size:13px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center}
input[type=text]{flex:1;width:100%;min-width:0;font:inherit;color:inherit;background:var(--fl);border:0;border-radius:14px;padding:12px;margin-bottom:10px;outline:0}
.row input[type=text]{margin:0}
::placeholder{color:var(--t2)}
button{font:inherit;color:var(--tx);background:var(--fl);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .2s}
button:active{transform:scale(.94)}button:disabled{opacity:.45;cursor:default}
.pri{background:linear-gradient(180deg,#ff5a6e,var(--ac));color:#fff;font-weight:600;width:100%;padding:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(250,45,72,.35)}
.row .g{white-space:nowrap}
.ck{display:flex;gap:8px;font-size:13px;color:var(--t2);margin:2px 0 12px}
button.on{background:var(--ac);color:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:0;margin:12px 0;background:linear-gradient(90deg,var(--tx) var(--p,0%),var(--fl) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
/* now playing */
.art{width:min(100%,300px);aspect-ratio:1;margin:6px auto 0;border-radius:24px;display:grid;place-items:center;font-size:90px;color:rgba(255,255,255,.92);background:linear-gradient(135deg,#fa2d48,#7b3ff2);box-shadow:0 22px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5);transform:scale(.86);transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
body.pl .art{transform:none}
.mr{display:flex;gap:8px;align-items:center;min-height:24px}.fm{font-size:12px;color:var(--ac);font-weight:600}
.by{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;color:#fff;background:var(--ac);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:-6px}
.ct{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.ct button{background:none;font-size:28px;padding:8px 14px}.ct .big{font-size:50px}.ct .on{color:var(--ac)}
.nxt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--fl);border-radius:20px;padding:10px 14px;margin-top:12px}
.nxt small{color:var(--t2);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
/* lists */
.qi{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:16px}
.qi.on{background:var(--fl)}
.qi em{font-style:normal;width:22px;text-align:center;color:var(--t2);font-size:13px}.qi.on em{color:var(--ac)}
.qi .mt{flex:1;min-width:0}.qi button{padding:6px 12px;font-size:13px}
#qc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}#qc button{font-size:13px;padding:6px 12px}
.cm i,.qi i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 sans-serif;font-style:normal;color:#fff}
.cm{display:flex;gap:8px;align-items:flex-start;font-size:14px;max-width:100%}
.cm span{overflow-wrap:anywhere;padding-top:4px}.sy span{color:var(--t2);font-style:italic}
#cl{height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
#cl:empty::before{content:attr(data-e);color:var(--t2);font-size:13px}
#fl{position:fixed;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),448px);bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:4}
#fl .cm{align-self:flex-start;padding:6px 14px 6px 6px;border-radius:20px;background:var(--gl);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--gb);animation:up .35s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
/* tab bar */
#tb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),448px);display:flex;gap:2px;padding:6px;border-radius:999px;z-index:5}

#tb b{font-size:19px;font-weight:400;line-height:1}
#tb button.on{background:var(--fl);color:var(--ac)}
#tb em{position:absolute;top:1px;right:22%;background:var(--ac);color:#fff;border-radius:99px;font-size:10px;font-style:normal;padding:0 5px}
/* eq */
.pre{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.pre button{font-size:13px;padding:6px 12px}
.bands{display:flex;justify-content:space-between}
.b{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--t2)}
.s{position:relative;width:28px;height:110px}.s input{position:absolute;left:-41px;top:52px;width:110px;margin:0;transform:rotate(-90deg)}
summary{font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <div class="row" id="adr"><button class="g gl" id="af" data-i="addf"></button><button class="g gl" id="ad" data-i="addd"></button></div>

  <input type="file" id="fd" webkitdirectory multiple hidden>
 </div>
 <div class="pane" hidden><div class="card"><h2 data-i="nLive"></h2><div id="cl"></div>
  <div class="row"><input type="text" id="ci" maxlength="200" autocomplete="off" data-p="cmt"><button class="pri" id="cs" style="width:auto" data-i="send"></button></div></div></div>
 <div class="pane" hidden><div class="card"><h2 data-i="queue"></h2><div id="qc"></div><div id="ql"></div></div></div>
 <div class="pane" hidden>
  <div class="card"><h2 data-i="ppl"></h2><div id="pl2"></div>
   <label class="ck hh" style="margin-top:12px"><input type="checkbox" id="aa" checked><span data-i="aa"></span></label>
   <p class="nt hh" data-i="ctn"></p></div>
  <details class="card"><summary data-i="eq"></summary>
   <p class="nt" data-i="eqn"></p><div class="pre"><button data-pr="flat" data-i="flat"></button><button data-pr="bass" data-i="bass"></button><button data-pr="vocal" data-i="vocal"></button><button data-pr="treble" data-i="treble"></button></div>
   <div class="bands" id="bands"></div></details>
  <details class="card"><summary data-i="dbg"></summary><pre id="lg2" class="nt" style="white-space:pre-wrap;font-size:11px"></pre></details>
  <button class="gl" id="lv" data-i="back"></button>
 </div>
</section>
</main>
<div id="fl"></div>
<nav id="tb" class="gl" hidden>
 <button><b>♪</b><span data-i="nNow"></span></button>
 <button><b>✎</b><span data-i="nLive"></span><em id="bd" hidden></em></button>

 <button><b>⚙&#xFE0E;</b><span data-i="nMore"></span></button>
</nav>

l:"All",ppl:"People in station",ctl:"Control",hostl:"Host",guest:"Listener",aa:"Listeners can add songs",ctn:"Tap “Control” to let a listener play, pause, skip and remove songs.",noadd:"The host isn’t allowing added songs.",big:"File too big (max 150 MB).",added:"added",upl:"Uploading",noc:"No comments yet. Start the conversation!",needn:"Please enter a display name to join.",rm:"Remove",removed:"was removed",kicked:"The host removed you from the station.",sig:"Connecting to server…",find:"Finding host…",slow:"slow network, please wait"}};
