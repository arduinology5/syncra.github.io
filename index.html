/* ---- shared file pump ---- */
async function pushBlob(dc,f,off,alive,pg){dc.bufferedAmountLowThreshold=65536;
 for(let o=off;o<f.size;o+=262144){const ab=await f.slice(o,o+262144).arrayBuffer();
  for(let i=0;i<ab.byteLength;i+=16384){
   while(dc.bufferedAmount>65536){if(!alive()||dc.readyState!="open")return 0;await Promise.race([new Promise(r=>dc.onbufferedamountlow=r),sl(400)])}
   if(!alive()||dc.readyState!="open")return 0;dc.send(ab.slice(i,i+16384))}
  if(pg)pg(Math.min(f.size,o+262144))}
 return 1}

async function pump(p){p.pm=1;
 try{while(1){const w=wanted(),g=p.gen;for(const k of p.has)if(!w.some(x=>x.id==k))p.has.delete(k);
  const x=w.find(y=>!p.has.has(y.id));if(!x)break;
  const off=p.part&&p.part.id==x.id?p.part.n:0;p.part=null;
  if(await sendFile(p,x,g,off))p.has.add(x.id);else if(p.gen==g)break}}
 finally{p.pm=0}}

 while(dc.readyState!="open"){if(!al())return 0;await sl(150)}
 dc.send(JSON.stringify({c:"f",id:x.id,ext:x.ext,size:f.size,type:f.type||MT[x.ext]||"",off}));
 if(!await pushBlob(dc,f,off,al))return 0;dc.send(JSON.stringify({c:"e",id:x.id}));return 1}
